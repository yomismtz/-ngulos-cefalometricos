name: Apply YomCeph flow redesign

on:
  push:
    branches:
      - yomceph-flow-redesign-2026-09-10

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[redesign-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: yomceph-flow-redesign-2026-09-10
          fetch-depth: 0

      - name: Apply redesign patch
        run: python3 tools/apply_flow_redesign.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply_flow_redesign.py .github/workflows/apply-flow-redesign.yml
          git add -A
          git commit -m "feat: redesign tracing workflow and landmark guidance [redesign-applied]"
          git push origin HEAD:yomceph-flow-redesign-2026-09-10
