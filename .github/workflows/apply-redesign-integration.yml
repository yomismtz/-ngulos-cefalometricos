name: Apply redesign integration

on:
  push:
    branches: [ 'redesign/flujo-puntos-y-guias' ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: redesign/flujo-puntos-y-guias
          fetch-depth: 0

      - name: Apply reproducible integration patch
        run: python3 ci/prepare-test-build.py

      - name: Verify patch changed only intended source files
        shell: bash
        run: |
          git status --short
          changed="$(git diff --name-only)"
          for file in $changed; do
            case "$file" in
              app/src/main/java/com/cefalo/angulos/AnalysisActivity.java|app/src/main/java/com/cefalo/angulos/MeasurementView.java|app/src/main/java/com/cefalo/angulos/PointGuide.java) ;;
              *) echo "Unexpected changed file: $file"; exit 1 ;;
            esac
          done

      - name: Commit integrated source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/cefalo/angulos/AnalysisActivity.java \
                  app/src/main/java/com/cefalo/angulos/MeasurementView.java \
                  app/src/main/java/com/cefalo/angulos/PointGuide.java
          git commit -m "Integrate SL SE partial results and explicit point selection"
          git push origin HEAD:redesign/flujo-puntos-y-guias
