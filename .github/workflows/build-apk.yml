name: Build YOM Análisis Radiográficos APK and Bundle

on:
  workflow_dispatch:
  push:
    branches: [ main, master, 'redesign/**' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare current test build
        if: startsWith(github.ref_name, 'redesign/')
        run: python3 ci/prepare-test-build.py

      - name: Normalize tangent help
        if: startsWith(github.ref_name, 'redesign/')
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/cefalo/angulos/PointGuide.java')
          s = path.read_text(encoding='utf-8')
          s = s.replace(
              'GUIDE.put("Go", "Gonion (Go): punto construido sobre el ángulo mandibular, en la bisectriz formada por la tangente al borde posterior de la rama y la tangente al borde inferior del cuerpo mandibular.");',
              'GUIDE.put("Go", "Gonion (Go): punto construido sobre el ángulo mandibular. Para construirlo geométricamente trace 2 tangentes: una al borde posterior de la rama y otra al borde inferior del cuerpo mandibular. Cada tangente se define con 2 puntos de apoyo/contacto sobre su contorno; después se obtiene la bisectriz del ángulo formado por ambas tangentes y se localiza Go según el protocolo cefalométrico.");'
          )
          s = s.replace(
              'GUIDE.put("CVT sup.", "CVT superior (etiqueta heredada): corresponde a CV2tg, punto de tangencia superoposterior de la odontoides de C2.");',
              'GUIDE.put("CVT sup.", "CVT superior (etiqueta heredada): corresponde a CV2tg. Es un landmark, no una tangente completa. En el protocolo adoptado, CVT se forma con 2 puntos: CV2tg + CV4ip.");'
          )
          s = s.replace(
              'GUIDE.put("CVT inf.", "CVT inferior (etiqueta heredada): corresponde a CV4ip, punto más inferoposterior del cuerpo de C4.");',
              'GUIDE.put("CVT inf.", "CVT inferior (etiqueta heredada): corresponde a CV4ip, segundo landmark de CVT. La línea CVT se forma con 2 puntos: CV2tg + CV4ip.");'
          )
          s = s.replace(
              'GUIDE.put("OPT sup.", "OPT superior (etiqueta heredada): corresponde a CV2tg, punto de tangencia superoposterior de la odontoides de C2.");',
              'GUIDE.put("OPT sup.", "OPT superior (etiqueta heredada): corresponde a CV2tg. Es un landmark, no una tangente completa. OPT se forma con 2 puntos: CV2tg + CV2ip.");'
          )
          s = s.replace(
              'GUIDE.put("OPT inf.", "OPT inferior (etiqueta heredada): corresponde a CV2ip, punto más inferoposterior del cuerpo de C2.");',
              'GUIDE.put("OPT inf.", "OPT inferior (etiqueta heredada): corresponde a CV2ip, segundo landmark de OPT. La línea OPT se forma con 2 puntos: CV2tg + CV2ip.");'
          )
          path.write_text(s, encoding='utf-8')
          PY

      - name: Apply clinical extensions and visual guides
        if: startsWith(github.ref_name, 'redesign/')
        run: python3 ci/extend-clinical-build.py

      - name: Expand McGregor cranio-cervical guide
        if: startsWith(github.ref_name, 'redesign/')
        run: python3 ci/augment-mcgregor-guide.py

      - name: Keep only calculable partial results
        if: startsWith(github.ref_name, 'redesign/')
        run: python3 ci/fix-result-diagnostics.py

      - name: Apply final radiographic audit
        if: startsWith(github.ref_name, 'redesign/')
        run: python3 ci/final-radiographic-audit.py

      - name: Refine radiographic assessment logic
        if: startsWith(github.ref_name, 'redesign/')
        run: python3 ci/refine-radiographic-logic.py

      - name: Apply branding and calibration assistant
        if: startsWith(github.ref_name, 'redesign/')
        run: python3 ci/mobile-brand-calibration.py

      - name: Apply exact fine adjustment
        if: startsWith(github.ref_name, 'redesign/')
        run: python3 ci/mobile-fine-adjust.py

      - name: Refine per-landmark visual guides
        if: startsWith(github.ref_name, 'redesign/')
        run: python3 ci/mobile-guide-polish.py

      - name: Generate dedicated tablet layout
        if: startsWith(github.ref_name, 'redesign/')
        run: python3 ci/mobile-responsive-layouts.py

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -n 1)
          test -n "$VERSION_NAME" || (echo "Could not read versionName" && exit 1)
          test -n "$VERSION_CODE" || (echo "Could not read versionCode" && exit 1)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Run Android lint
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:lintDebug :app:lintRelease
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "===== DEBUG LINT ERRORS ====="
            test -f app/build/reports/lint-results-debug.txt && grep -n -A4 -B2 "Error:" app/build/reports/lint-results-debug.txt || true
            echo "===== RELEASE LINT ERRORS ====="
            test -f app/build/reports/lint-results-release.txt && grep -n -A4 -B2 "Error:" app/build/reports/lint-results-release.txt || true
            exit $STATUS
          fi

      - name: Build test APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Enable KVM for launch test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify APK really opens on Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.yomceph.app
            adb shell am start -W -n com.yomceph.app/com.cefalo.angulos.MainActivity
            sleep 4
            PID=$(adb shell pidof com.yomceph.app | tr -d '\r')
            if [ -z "$PID" ]; then
              echo "Launcher process exited after opening. Recent AndroidRuntime log:"
              adb logcat -d -t 500 | grep -E "FATAL EXCEPTION|AndroidRuntime|com.yomceph.app" || true
              exit 1
            fi
            echo "Launcher smoke test passed with PID $PID"

      - name: Build release App Bundle
        run: gradle --no-daemon :app:bundleRelease

      - name: Rename artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "YOM-Analisis-Radiograficos-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}-test.apk"
          cp app/build/outputs/bundle/release/app-release.aab "YOM-Analisis-Radiograficos-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}-unsigned.aab"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: YOM-Analisis-Radiograficos-Test-APK-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}
          path: YOM-Analisis-Radiograficos-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}-test.apk
          if-no-files-found: error

      - name: Upload unsigned App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: YOM-Analisis-Radiograficos-Unsigned-AAB-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}
          path: YOM-Analisis-Radiograficos-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}-unsigned.aab
