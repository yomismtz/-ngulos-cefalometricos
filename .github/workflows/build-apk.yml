name: Build Android APK and Bundle

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug :app:lintRelease

      - name: Build test APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Build release App Bundle
        run: gradle --no-daemon :app:bundleRelease

      - name: Rename artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk YomCeph-v1.16-test.apk
          cp app/build/outputs/bundle/release/app-release.aab YomCeph-v1.16-unsigned.aab

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: YomCeph-Test-APK
          path: YomCeph-v1.16-test.apk
          if-no-files-found: error

      - name: Upload unsigned App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: YomCeph-Unsigned-AAB
          path: YomCeph-v1.16-unsigned.aab
          if-no-files-found: error
