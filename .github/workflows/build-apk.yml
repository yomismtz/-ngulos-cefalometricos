name: Build Android APK and Bundle

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -n 1)
          test -n "$VERSION_NAME" || (echo "Could not read versionName" && exit 1)
          test -n "$VERSION_CODE" || (echo "Could not read versionCode" && exit 1)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug :app:lintRelease

      - name: Build test APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Build release App Bundle
        run: gradle --no-daemon :app:bundleRelease

      - name: Rename artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "YomCeph-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}-test.apk"
          cp app/build/outputs/bundle/release/app-release.aab "YomCeph-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}-unsigned.aab"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: YomCeph-Test-APK-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}
          path: YomCeph-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}-test.apk
          if-no-files-found: error

      - name: Upload unsigned App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: YomCeph-Unsigned-AAB-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}
          path: YomCeph-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}-unsigned.aab
          if-no-files-found: error
