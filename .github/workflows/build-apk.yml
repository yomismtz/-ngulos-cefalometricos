name: Build YOM Análisis Radiográficos APK and Bundle

on:
  workflow_dispatch:
  push:
    branches: [ main, master, 'redesign/**', 'fix/**' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate and verify release source
        run: python3 ci/prepare-release-source.py

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -n 1)
          test -n "$VERSION_NAME" || (echo "Could not read versionName" && exit 1)
          test -n "$VERSION_CODE" || (echo "Could not read versionCode" && exit 1)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Capture exact generated source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-audit
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "versionName=${{ steps.app_version.outputs.name }}"
            echo "versionCode=${{ steps.app_version.outputs.code }}"
          } > build-audit/BUILD-MANIFEST.txt

          find app/src -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > build-audit/SOURCE-SHA256.txt
          sha256sum app/build.gradle build.gradle settings.gradle \
            >> build-audit/SOURCE-SHA256.txt

          tar -czf build-audit/generated-source.tar.gz \
            app/src \
            app/build.gradle \
            build.gradle \
            settings.gradle \
            ci \
            .github/workflows/build-apk.yml

      - name: Upload exact generated source
        uses: actions/upload-artifact@v4
        with:
          name: YOM-Generated-Source-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}
          path: build-audit/
          if-no-files-found: error

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Run Android lint
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:lintDebug :app:lintRelease
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "===== DEBUG LINT ERRORS ====="
            test -f app/build/reports/lint-results-debug.txt && grep -n -A4 -B2 "Error:" app/build/reports/lint-results-debug.txt || true
            echo "===== RELEASE LINT ERRORS ====="
            test -f app/build/reports/lint-results-release.txt && grep -n -A4 -B2 "Error:" app/build/reports/lint-results-release.txt || true
            exit $STATUS
          fi

      - name: Build test APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Enable KVM for launch test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify APK really opens on Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop yom.Analisis
            adb shell am start -W -n yom.Analisis/com.cefalo.angulos.MainActivity
            sleep 4
            test -n "$(adb shell pidof yom.Analisis | tr -d '\r')"
            echo "Launcher remained alive after cold start"

      - name: Build release App Bundle
        run: gradle --no-daemon :app:bundleRelease

      - name: Rename artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "YOM-Analisis-Radiograficos-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}-test.apk"
          cp app/build/outputs/bundle/release/app-release.aab "YOM-Analisis-Radiograficos-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}-unsigned.aab"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: YOM-Analisis-Radiograficos-Test-APK-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}
          path: YOM-Analisis-Radiograficos-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}-test.apk
          if-no-files-found: error

      - name: Upload unsigned App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: YOM-Analisis-Radiograficos-Unsigned-AAB-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}
          path: YOM-Analisis-Radiograficos-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}-unsigned.aab
          if-no-files-found: error
