name: Build YOM Steiner-only APK

on:
  workflow_dispatch:
  push:
    branches: [ 'fix/build-steiner-only-1.34' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate verified base source
        run: python3 ci/prepare-release-source.py

      - name: Apply Steiner-only edition
        run: python3 ci/prepare-steiner-only.py

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -n 1)
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug

      - name: Build Steiner APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Enable KVM for launch test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify Steiner APK opens on Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.yomceph.cefalometrico
            adb shell am start -W -n com.yomceph.cefalometrico/com.cefalo.angulos.MainActivity
            sleep 4
            test -n "$(adb shell pidof com.yomceph.cefalometrico | tr -d '\r')"
            echo "Steiner launcher remained alive after cold start"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "YOM-Steiner-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}.apk"

      - name: Upload Steiner APK
        uses: actions/upload-artifact@v4
        with:
          name: YOM-Steiner-APK-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}
          path: YOM-Steiner-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}.apk
          if-no-files-found: error
