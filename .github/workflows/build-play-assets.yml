name: Build Google Play assets for both YOM editions

on:
  push:
    branches: [ 'fix/play-assets-1.34' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play-assets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: radiograficos
            apply_steiner: 'false'
            app_id: com.yomceph.app
          - edition: steiner
            apply_steiner: 'true'
            app_id: com.yomceph.cefalometrico

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate verified release source
        run: python3 ci/prepare-release-source.py

      - name: Apply Steiner-only edition
        if: matrix.apply_steiner == 'true'
        run: python3 ci/prepare-steiner-only.py

      - name: Enable R8 mapping for Play release
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text(encoding='utf-8')
          old = '            minifyEnabled false\n'
          new = "            minifyEnabled true\n            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')\n"
          if old not in s:
              raise SystemExit('Expected minifyEnabled false anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Read version and verify application id
        id: app
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -n 1)
          APP_ID=$(sed -n "s/.*applicationId '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          test "$APP_ID" = "${{ matrix.app_id }}" || (echo "Unexpected applicationId: $APP_ID" && exit 1)
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          if [ "${{ matrix.edition }}" = "radiograficos" ]; then
            STEM="YOM-Analisis-Radiograficos-v${VERSION_NAME}-${VERSION_CODE}"
          else
            STEM="YOM-Steiner-v${VERSION_NAME}-${VERSION_CODE}"
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "stem=$STEM" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests and release lint
        run: |
          gradle --no-daemon :app:testDebugUnitTest
          gradle --no-daemon :app:lintRelease

      - name: Build unsigned minified AAB and exact mapping
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:bundleRelease
          test -f app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/mapping/release/mapping.txt
          mkdir -p dist
          STEM='${{ steps.app.outputs.stem }}'
          cp app/build/outputs/bundle/release/app-release.aab "dist/${STEM}-unsigned.aab"
          cp app/build/outputs/mapping/release/mapping.txt "dist/${STEM}-mapping.txt"

      - name: Create temporary test signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/test-release.jks" \
            -storepass testpass123 -keypass testpass123 \
            -alias testrelease -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=YOM CI Test, OU=CI, O=YOM, L=Test, ST=Test, C=MX"

      - name: Build minified release APK for launch validation
        env:
          YOMCEPH_KEYSTORE_PATH: ${{ runner.temp }}/test-release.jks
          YOMCEPH_KEYSTORE_PASSWORD: testpass123
          YOMCEPH_KEY_ALIAS: testrelease
          YOMCEPH_KEY_PASSWORD: testpass123
        run: gradle --no-daemon :app:assembleRelease

      - name: Enable KVM for release launch test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify minified release opens on Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am force-stop ${{ steps.app.outputs.app_id }}
            adb shell am start -W -n ${{ steps.app.outputs.app_id }}/com.cefalo.angulos.MainActivity
            sleep 4
            test -n "$(adb shell pidof ${{ steps.app.outputs.app_id }} | tr -d '\r')"
            echo "Minified release remained alive after cold start"

      - name: Prepare Play Console support files
        shell: bash
        run: |
          set -euo pipefail
          STEM='${{ steps.app.outputs.stem }}'
          if unzip -l "dist/${STEM}-unsigned.aab" | grep -Eq '(^|[[:space:]])base/lib/.+\.so$'; then
            echo "Native libraries detected unexpectedly; refusing to create a fake symbols archive." >&2
            exit 1
          fi
          printf '%s\n' \
            'NO SE REQUIERE ARCHIVO ZIP DE SIMBOLOS NATIVOS.' \
            '' \
            'Esta version no contiene bibliotecas nativas .so ni codigo C/C++/NDK.' \
            'Google Play solo solicita native debug symbols (.zip) cuando existe codigo nativo.' \
            'No subas el ZIP general de respaldo en el campo de simbolos nativos.' \
            > "dist/${STEM}-native-debug-symbols-NO-APLICA.txt"
          printf '%s\n' \
            'AAB SIN FIRMA DE CARGA DE GOOGLE PLAY.' \
            'El repositorio no tiene configurados actualmente los secretos de la clave de carga.' \
            'Debe firmarse con la clave de carga registrada antes de subirlo a Play Console.' \
            > "dist/${STEM}-FIRMA-PENDIENTE.txt"
          sha256sum "dist/${STEM}-unsigned.aab" "dist/${STEM}-mapping.txt" > "dist/${STEM}-SHA256.txt"
          cd dist
          zip -q "${STEM}-Google-Play-assets.zip" \
            "${STEM}-unsigned.aab" \
            "${STEM}-mapping.txt" \
            "${STEM}-native-debug-symbols-NO-APLICA.txt" \
            "${STEM}-FIRMA-PENDIENTE.txt" \
            "${STEM}-SHA256.txt"
          ls -lh

      - name: Upload Play assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app.outputs.stem }}-Google-Play
          path: dist/
          if-no-files-found: error
