name: Build Signed Google Play Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play-bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate and verify release source
        if: startsWith(github.ref_name, 'redesign/') || startsWith(github.ref_name, 'fix/')
        run: python3 ci/prepare-release-source.py

      - name: Verify signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.YOMCEPH_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.YOMCEPH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YOMCEPH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.YOMCEPH_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing YOMCEPH_UPLOAD_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing YOMCEPH_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing YOMCEPH_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing YOMCEPH_KEY_PASSWORD" && exit 1)

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -n 1)
          test -n "$VERSION_NAME" || (echo "Could not read versionName" && exit 1)
          test -n "$VERSION_CODE" || (echo "Could not read versionCode" && exit 1)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Capture exact Play source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p play-source-audit
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "versionName=${{ steps.app_version.outputs.name }}"
            echo "versionCode=${{ steps.app_version.outputs.code }}"
          } > play-source-audit/BUILD-MANIFEST.txt
          find app/src -type f -print0 | sort -z | xargs -0 sha256sum > play-source-audit/SOURCE-SHA256.txt
          sha256sum app/build.gradle build.gradle settings.gradle >> play-source-audit/SOURCE-SHA256.txt
          tar -czf play-source-audit/generated-source.tar.gz \
            app/src app/build.gradle build.gradle settings.gradle ci \
            .github/workflows/build-play.yml

      - name: Upload exact Play source
        uses: actions/upload-artifact@v4
        with:
          name: YOM-Play-Source-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}
          path: play-source-audit/
          if-no-files-found: error

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.YOMCEPH_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/yomceph-upload.jks"
          chmod 600 "$RUNNER_TEMP/yomceph-upload.jks"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Lint and build signed AAB
        env:
          YOMCEPH_KEYSTORE_PATH: ${{ runner.temp }}/yomceph-upload.jks
          YOMCEPH_KEYSTORE_PASSWORD: ${{ secrets.YOMCEPH_KEYSTORE_PASSWORD }}
          YOMCEPH_KEY_ALIAS: ${{ secrets.YOMCEPH_KEY_ALIAS }}
          YOMCEPH_KEY_PASSWORD: ${{ secrets.YOMCEPH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:lintRelease :app:bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab "YOM-Analisis-Radiograficos-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}-google-play.aab"
          sha256sum "YOM-Analisis-Radiograficos-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}-google-play.aab" > "YOM-Analisis-Radiograficos-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}-google-play.aab.sha256"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: YOM-Google-Play-AAB-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}
          path: |
            YOM-Analisis-Radiograficos-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}-google-play.aab
            YOM-Analisis-Radiograficos-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}-google-play.aab.sha256
          if-no-files-found: error
