name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - desktop-exe-vertebral
      - desktop-v0114-research-metadata
      - desktop-v0115-quality-audit
      - desktop-v0116-universal-ui
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows-exe.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r desktop/requirements.txt

      - name: Create brand assets
        run: python desktop/create_brand_assets.py

      - name: Validate v0.11.6 source
        shell: pwsh
        run: |
          python -m py_compile desktop/yomceph_desktop_v115_quality_audit.py
          python -m py_compile desktop/yomceph_desktop_v115.py
          python -m py_compile desktop/yomceph_desktop_v116.py
          python -m py_compile desktop/yomceph_desktop_v116_final.py
          python -m json.tool desktop/yomceph_i18n.json | Out-Null

      - name: Build installed application folder
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --manifest desktop/yomceph.manifest --icon desktop/yomceph.ico --add-data "desktop/yomceph.ico;." --add-data "desktop/yomceph_logo.png;." --add-data "desktop/yomceph_i18n.json;." --name YomCeph_Desktop desktop/yomceph_desktop_v116_final.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          }
          & $iscc "desktop\YomCeph_v0116.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: YomCeph_Desktop_Installer_v0.11.6
          path: installer/YomCeph_Desktop_Setup_v0.11.6.exe
          if-no-files-found: error
