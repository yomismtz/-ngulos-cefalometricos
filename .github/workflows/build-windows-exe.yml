name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - desktop-exe-vertebral
      - desktop-v0114-research-metadata
      - desktop-v0115-quality-audit
      - desktop-v0116-universal-ui
      - desktop-v0120-workflow-builder
    paths:
      - 'desktop/**'
      - 'website/**'
      - 'PRIVACY_POLICY.md'
      - '.github/workflows/build-windows-exe.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -r desktop/requirements.txt
          pip install pytest==8.4.2

      - name: Create brand assets
        run: python desktop/create_brand_assets.py

      - name: Validate source, formulas and distribution contract
        shell: pwsh
        run: |
          python -m py_compile desktop/yomceph_desktop_v115_quality_audit.py
          python -m py_compile desktop/yomceph_desktop_v115.py
          python -m py_compile desktop/yomceph_desktop_v116.py
          python -m py_compile desktop/yomceph_desktop_v116_final.py
          python -m py_compile desktop/yomceph_scientific_catalog.py
          python -m py_compile desktop/yomceph_v120_geometry.py
          python -m py_compile desktop/yomceph_radiograph_loader.py
          python -m py_compile desktop/yomceph_updater.py
          python -m py_compile desktop/yomceph_desktop_v120.py
          python -m py_compile desktop/yomceph_desktop_v120_final.py
          python -m py_compile desktop/yomceph_desktop_v120_release.py
          python -m py_compile desktop/yomceph_desktop_v120_release_final.py
          python -m py_compile desktop/yomceph_desktop_v120_distribution.py
          python -m py_compile desktop/yomceph_desktop_v123_hardening.py
          python -m py_compile desktop/yomceph_desktop_v124_personalization.py
          python -m py_compile desktop/smoke_v123_windows.py
          python -m py_compile desktop/smoke_v124_windows.py
          python -m json.tool desktop/yomceph_i18n.json | Out-Null
          python -m pytest desktop/test_v120_catalog.py desktop/test_v120_geometry.py desktop/test_v120_protocol_rules.py desktop/test_v120_public_release.py desktop/test_v120_radiograph_loader.py desktop/test_v120_updater.py desktop/test_v120_distribution_contract.py desktop/test_v123_hardening.py desktop/test_v124_personalization.py -q

      - name: Windows Tkinter functional smoke test
        shell: pwsh
        run: |
          python desktop/smoke_v123_windows.py
          python desktop/smoke_v124_windows.py

      - name: Build installed application folder
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --manifest desktop/yomceph.manifest --icon desktop/yomceph.ico --add-data "desktop/yomceph.ico;." --add-data "desktop/yomceph_logo.png;." --add-data "desktop/yomceph_i18n.json;." --name YomCeph_Desktop desktop/yomceph_desktop_v123_hardening.py

      - name: Packaged EXE startup smoke test
        shell: pwsh
        run: |
          $oldLocalAppData = $env:LOCALAPPDATA
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "YomCephPackagedSmokeData"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $exe = Resolve-Path "dist\YomCeph_Desktop\YomCeph_Desktop.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          if ($p.HasExited) { throw "El EXE empaquetado se cerró durante el arranque. ExitCode=$($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          $env:LOCALAPPDATA = $oldLocalAppData
          Write-Host "Packaged EXE startup smoke test: OK"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          }
          & $iscc "desktop\YomCeph_v0120.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falló" }
          $version = (Get-Content desktop/VERSION -Raw).Trim()
          $exe = "installer\YomCeph_Desktop_Setup_v$version.exe"
          if (!(Test-Path $exe)) { throw "No se generó $exe" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  YomCeph_Desktop_Setup_v$version.exe" | Set-Content "$exe.sha256" -Encoding ascii
          Write-Host "SHA256=$hash"

      - name: Silent installer + installed EXE smoke test
        shell: pwsh
        run: |
          $version = (Get-Content desktop/VERSION -Raw).Trim()
          $setup = Resolve-Path "installer\YomCeph_Desktop_Setup_v$version.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "YomCephInstalledSmoke"
          $dataDir = Join-Path $env:RUNNER_TEMP "YomCephInstalledSmokeData"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $install = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "El instalador silencioso falló. ExitCode=$($install.ExitCode)" }
          $installedExe = Join-Path $installDir "YomCeph_Desktop.exe"
          if (!(Test-Path $installedExe)) { throw "El instalador no creó $installedExe" }
          $oldLocalAppData = $env:LOCALAPPDATA
          $env:LOCALAPPDATA = $dataDir
          $p = Start-Process -FilePath $installedExe -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          if ($p.HasExited) { throw "El EXE instalado se cerró durante el arranque. ExitCode=$($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          $env:LOCALAPPDATA = $oldLocalAppData
          Write-Host "Silent installer + installed EXE smoke test: OK"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: YomCeph_Desktop_Installer
          path: |
            installer/YomCeph_Desktop_Setup_v*.exe
            installer/YomCeph_Desktop_Setup_v*.exe.sha256
          if-no-files-found: error
