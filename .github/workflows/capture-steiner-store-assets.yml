name: Capture YOM Steiner Play Store Screenshots

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/capture-steiner-store-assets.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate release source
        run: python3 ci/prepare-release-source.py

      - name: Transform to Steiner-only edition
        run: python3 ci/prepare-steiner-only.py

      - name: Force Steiner package after base Play transform
        run: |
          sed -i "s/applicationId 'yom.Analisis'/applicationId 'com.yomceph.cefalometrico'/" app/build.gradle
          grep -F "applicationId 'com.yomceph.cefalometrico'" app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Steiner debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture real app screens
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            mkdir -p store-assets
            adb shell wm size 1080x1920
            adb shell wm density 420
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell run-as com.yomceph.cefalometrico mkdir -p shared_prefs
            adb shell "echo '<map><boolean name=\"educational_disclaimer_shown\" value=\"true\" /></map>' | run-as com.yomceph.cefalometrico sh -c 'cat > shared_prefs/yomceph_prefs.xml'"
            adb shell am force-stop com.yomceph.cefalometrico
            adb shell am start -W -n com.yomceph.cefalometrico/com.cefalo.angulos.MainActivity
            sleep 4
            adb exec-out screencap -p > store-assets/01-inicio-steiner.png
            adb shell am start -W -n com.yomceph.cefalometrico/com.cefalo.angulos.AnalysisActivity --es MODE STEINER
            sleep 4
            adb exec-out screencap -p > store-assets/02-analisis-steiner.png
            adb shell am start -W -n com.yomceph.cefalometrico/com.cefalo.angulos.SavedStudiesActivity
            sleep 3
            adb exec-out screencap -p > store-assets/03-mis-analisis.png
            adb shell am start -W -n com.yomceph.cefalometrico/com.cefalo.angulos.InfoActivity
            sleep 3
            adb exec-out screencap -p > store-assets/04-informacion-privacidad.png
            file store-assets/*.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: YOM-Steiner-Play-Store-Real-Screenshots
          path: store-assets/*.png
          if-no-files-found: error
