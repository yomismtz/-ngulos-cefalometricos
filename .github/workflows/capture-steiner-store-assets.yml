name: Capture YOM Steiner Play Store Screenshots

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/capture-steiner-store-assets.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate release source
        run: python3 ci/prepare-release-source.py

      - name: Transform to Steiner-only edition
        run: python3 ci/prepare-steiner-only.py

      - name: Force Steiner package after base Play transform
        run: |
          sed -i "s/applicationId 'yom.Analisis'/applicationId 'com.yomceph.cefalometrico'/" app/build.gradle
          grep -F "applicationId 'com.yomceph.cefalometrico'" app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Steiner debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture real app screens
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p store-assets
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.yomceph.cefalometrico
            adb shell am start -W -n com.yomceph.cefalometrico/com.cefalo.angulos.MainActivity
            sleep 3

            cat > /tmp/find_ui.py <<'PY'
            import re
            import sys
            import xml.etree.ElementTree as ET

            needle = sys.argv[1].lower()
            root = ET.parse('/tmp/window.xml').getroot()
            for node in root.iter('node'):
                hay = ' '.join([
                    node.attrib.get('text', ''),
                    node.attrib.get('resource-id', ''),
                    node.attrib.get('content-desc', ''),
                ]).lower()
                if needle not in hay:
                    continue
                match = re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds', ''))
                if match:
                    x1, y1, x2, y2 = map(int, match.groups())
                    print((x1 + x2) // 2, (y1 + y2) // 2)
                    raise SystemExit(0)
            raise SystemExit(1)
            PY

            tap_ui() {
              local needle="$1"
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
              local coords
              coords=$(python3 /tmp/find_ui.py "$needle")
              adb shell input tap $coords
              sleep 2
            }

            tap_ui "ENTENDIDO" || true
            sleep 1
            adb exec-out screencap -p > store-assets/01-inicio-steiner.png

            tap_ui "btnSteiner"
            adb exec-out screencap -p > store-assets/02-analisis-steiner.png

            adb shell input keyevent KEYCODE_BACK
            sleep 2
            tap_ui "btnStudies"
            adb exec-out screencap -p > store-assets/03-mis-analisis.png

            adb shell input keyevent KEYCODE_BACK
            sleep 2
            tap_ui "btnInfo"
            adb exec-out screencap -p > store-assets/04-informacion-privacidad.png

            file store-assets/*.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: YOM-Steiner-Play-Store-Real-Screenshots
          path: store-assets/*.png
          if-no-files-found: error
