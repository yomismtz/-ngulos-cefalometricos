name: Feature verification

on:
  push:
    branches:
      - feature-autosave-export-dark-accessibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Lint
        run: gradle --no-daemon :app:lintDebug :app:lintRelease

      - name: Build test APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: YomCeph-1.18-feature-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
