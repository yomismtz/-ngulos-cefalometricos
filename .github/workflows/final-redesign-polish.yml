name: Final YomCeph redesign polish

on:
  push:
    branches:
      - yomceph-flow-redesign-2026-09-10

permissions:
  contents: write

jobs:
  polish-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[polish-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: yomceph-flow-redesign-2026-09-10
          fetch-depth: 0

      - name: Polish interaction guidance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/cefalo/angulos/AnalysisActivity.java')
          s = p.read_text(encoding='utf-8')
          replacements = [
              (
                  '''                        : selectedPlaced\n                                ? "Corregir: "\n                                : "Marcar: ";''',
                  '''                        : selectedPlaced\n                                ? "Ajustar (mantén pulsado): "\n                                : "Marcar: ";'''
              ),
              (
                  '''            btnCalculate.setAlpha(0.55f);\n        }\n\n        updateLockButton();''',
                  '''            btnCalculate.setAlpha(\n                    countAvailableMeasurements() > 0 ? 1f : 0.55f\n            );\n        }\n\n        updateLockButton();'''
              ),
              (
                  '''? "\\n\\n✓ Ya está colocado. Para corregirlo, seleccione su recuadro y toque la nueva posición en la radiografía."''',
                  '''? "\\n\\n✓ Ya está colocado. Para corregirlo, seleccione su recuadro, mantenga presionado el punto en la radiografía y arrástrelo con la lupa."'''
              ),
              (
                  '''            case "Oclusal 2": return "Oc2";\n            case "CVT sup.": return "CVTs";''',
                  '''            case "Oclusal 2": return "Oc2";\n            case "Cv2tg": return "C2tg";\n            case "Cv2ip": return "C2ip";\n            case "Cv4ip": return "C4ip";\n            case "CVT sup.": return "CVTs";'''
              ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Expected polish target not found:\n' + old)
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify tests lint and APK
        run: |
          gradle --no-daemon :app:testDebugUnitTest
          gradle --no-daemon :app:lintDebug
          gradle --no-daemon :app:assembleDebug

      - name: Commit verified polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-redesign-polish.yml
          git add -A
          git commit -m "fix: align UI guidance with partial tracing workflow [polish-applied]"
          git push origin HEAD:yomceph-flow-redesign-2026-09-10
