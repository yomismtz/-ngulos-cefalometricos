name: Final Tweed reference verification

on:
  push:
    branches:
      - fix-tweed-reference-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Lint
        run: gradle --no-daemon :app:lintDebug :app:lintRelease
      - name: Build APK and AAB
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YomCeph-Test-APK-v1.22-23
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
