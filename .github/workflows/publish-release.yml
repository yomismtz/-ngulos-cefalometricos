name: Publish YomCeph Desktop Release

on:
  workflow_dispatch:
  push:
    branches:
      - desktop-exe-vertebral
    paths:
      - 'desktop/VERSION'
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r desktop/requirements.txt
          pip install pytest==8.4.2

      - name: Validate version contract
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content desktop/VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION inválida: $version" }
          $distribution = Get-Content desktop/yomceph_desktop_v120_distribution.py -Raw
          $iss = Get-Content desktop/YomCeph_v0120.iss -Raw
          if ($distribution -notmatch ('APP_VERSION = "' + [regex]::Escape($version) + '"')) { throw "APP_VERSION no coincide con VERSION" }
          if ($iss -notmatch ('#define MyAppVersion "' + [regex]::Escape($version) + '"')) { throw "Inno AppVersion no coincide con VERSION" }

          $tag = "v$version"
          $existingTarget = gh release view $tag --repo "${{ github.repository }}" --json targetCommitish --jq '.targetCommitish' 2>$null
          $releaseExists = ($LASTEXITCODE -eq 0)
          if (-not $releaseExists) {
            $existingTarget = ""
            $global:LASTEXITCODE = 0
          }
          if ($releaseExists -and $existingTarget -and $existingTarget.Trim() -ne $env:GITHUB_SHA) {
            throw "La versión $tag ya fue publicada desde otro commit. Aumente desktop/VERSION antes de publicar una nueva compilación."
          }

      - name: Create brand assets
        run: python desktop/create_brand_assets.py

      - name: Run complete v0.12 test suite
        shell: pwsh
        run: |
          python -m py_compile desktop/yomceph_desktop_v115_quality_audit.py
          python -m py_compile desktop/yomceph_desktop_v115.py
          python -m py_compile desktop/yomceph_desktop_v116.py
          python -m py_compile desktop/yomceph_desktop_v116_final.py
          python -m py_compile desktop/yomceph_scientific_catalog.py
          python -m py_compile desktop/yomceph_v120_geometry.py
          python -m py_compile desktop/yomceph_radiograph_loader.py
          python -m py_compile desktop/yomceph_updater.py
          python -m py_compile desktop/yomceph_desktop_v120.py
          python -m py_compile desktop/yomceph_desktop_v120_final.py
          python -m py_compile desktop/yomceph_desktop_v120_release.py
          python -m py_compile desktop/yomceph_desktop_v120_release_final.py
          python -m py_compile desktop/yomceph_desktop_v120_distribution.py
          python -m py_compile desktop/smoke_v120_windows.py
          python -m json.tool desktop/yomceph_i18n.json | Out-Null
          python -m pytest desktop/test_v120_catalog.py desktop/test_v120_geometry.py desktop/test_v120_protocol_rules.py desktop/test_v120_public_release.py desktop/test_v120_radiograph_loader.py desktop/test_v120_updater.py desktop/test_v120_distribution_contract.py -q

      - name: Windows Tkinter startup smoke test
        shell: pwsh
        run: python desktop/smoke_v120_windows.py

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --manifest desktop/yomceph.manifest --icon desktop/yomceph.ico --add-data "desktop/yomceph.ico;." --add-data "desktop/yomceph_logo.png;." --add-data "desktop/yomceph_i18n.json;." --name YomCeph_Desktop desktop/yomceph_desktop_v120_distribution.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build and verify installer assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer,release | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source }
          & $iscc "desktop\YomCeph_v0120.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falló" }

          $version = (Get-Content desktop/VERSION -Raw).Trim()
          $source = "installer\YomCeph_Desktop_Setup_v$version.exe"
          if (!(Test-Path $source)) { throw "No se generó $source" }
          Copy-Item $source "release\YomCeph_Desktop_Setup.exe" -Force
          Copy-Item $source "release\YomCeph_Desktop_Setup_v$version.exe" -Force
          $hash = (Get-FileHash "release\YomCeph_Desktop_Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  YomCeph_Desktop_Setup.exe" | Set-Content "release\YomCeph_Desktop_Setup.exe.sha256" -Encoding ascii
          Write-Host "Release SHA256=$hash"

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content desktop/VERSION -Raw).Trim()
          $tag = "v$version"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          if (-not $releaseExists) {
            $global:LASTEXITCODE = 0
            gh release create $tag --repo "${{ github.repository }}" --target "$env:GITHUB_SHA" --title "YomCeph Desktop v$version" --notes "YomCeph Desktop v$version. Descarga pública para Windows. Incluye flujo individual/investigación, importación de imágenes y PDF, exportación Excel/SPSS, control de calidad y actualizaciones verificadas mediante SHA-256. Los datos clínicos permanecen locales; la comprobación de versiones consulta únicamente metadatos públicos de GitHub Releases."
            if ($LASTEXITCODE -ne 0) { throw "No se pudo crear la Release" }
          }
          gh release upload $tag --repo "${{ github.repository }}" --clobber `
            "release\YomCeph_Desktop_Setup.exe" `
            "release\YomCeph_Desktop_Setup.exe.sha256" `
            "release\YomCeph_Desktop_Setup_v$version.exe"
          if ($LASTEXITCODE -ne 0) { throw "No se pudieron subir los assets de la Release" }

      - name: Upload CI copy
        uses: actions/upload-artifact@v4
        with:
          name: YomCeph_Desktop_Public_Release
          path: release/*
          if-no-files-found: error
