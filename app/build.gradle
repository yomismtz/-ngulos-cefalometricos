plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cefalo.angulos'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cefalo.angulos'
        minSdk 24
        targetSdk 35
        versionCode 13
        versionName '1.12'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
}
