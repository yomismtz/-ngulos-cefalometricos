plugins {
    id 'com.android.application'
}

def signingEnv = [
        "YOMCEPH_KEYSTORE_PATH",
        "YOMCEPH_KEYSTORE_PASSWORD",
        "YOMCEPH_KEY_ALIAS",
        "YOMCEPH_KEY_PASSWORD"
]
def hasReleaseSigning = signingEnv.every { key ->
    def value = System.getenv(key)
    value != null && !value.trim().isEmpty()
}

android {
    namespace 'com.cefalo.angulos'
    compileSdk 36

    defaultConfig {
        // Keep this identifier stable after the first upload to Play Console.
        applicationId 'com.yomceph.app'
        minSdk 24
        targetSdk 36
        versionCode 21
        versionName '1.20'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(System.getenv("YOMCEPH_KEYSTORE_PATH"))
                storePassword System.getenv("YOMCEPH_KEYSTORE_PASSWORD")
                keyAlias System.getenv("YOMCEPH_KEY_ALIAS")
                keyPassword System.getenv("YOMCEPH_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
